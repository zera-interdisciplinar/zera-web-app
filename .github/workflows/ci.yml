name: CI

# Reusable validation for branch checks and GKE deployments.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Type check
        run: node ./node_modules/typescript/bin/tsc -b
      - name: Unit tests with coverage (>= 80 % of lines in src/services, src/utils and src/reducers)
        run: npm run test:coverage
      - run: npm run build
      - name: No private values in the bundle
        run: npm run check:bundle

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run build
      - run: node ./node_modules/@playwright/test/cli.js test --workers=1
        env:
          ZERA_RUN_PRODUCTION_TESTS: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results
