name: Deploy Web

on:
  push:
    branches: [qa]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.event_name == 'release' && 'production' || 'qa' }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'qa' }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ github.event_name == 'release' && 'production' || 'qa' }}
      IMAGE: southamerica-east1-docker.pkg.dev/zera-512810/repo/zera-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Production must use a revision from main
        if: env.TARGET_ENV == 'production'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659911714707/locations/global/workloadIdentityPools/zera-pool/providers/github-provider
          service_account: github-actions-deploy@zera-512810.iam.gserviceaccount.com
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: zera-512810
          cluster_name: zera-cluster
          location: southamerica-east1
      - name: Verify required namespace and gateway key
        run: |
          kubectl get namespace "$TARGET_ENV" >/dev/null
          kubectl get secret mobile-app-key-auth-secret -n "$TARGET_ENV" -o json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s.get("data", {}).get("key"), "Missing gateway apiKey"'
      - name: Production APIs must already be available
        if: env.TARGET_ENV == 'production'
        run: |
          for service in ms-administrative-core ms-inventory ms-analytics-bff; do
            kubectl get deployment "$service" -n production -o json | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["spec"].get("replicas",1)>0 and s.get("status",{}).get("availableReplicas",0)>0, "Production API is not active"'
          done
      - run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push an immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Render and deploy the same image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          kubectl kustomize "k8s/overlays/$TARGET_ENV" | sed "s|$IMAGE:IMAGE_TAG|$IMAGE@$DIGEST|g" > "$RUNNER_TEMP/web.yaml"
          if grep -q IMAGE_TAG "$RUNNER_TEMP/web.yaml"; then exit 1; fi
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/web.yaml"
          kubectl apply -f "$RUNNER_TEMP/web.yaml"
          kubectl rollout status deployment/zera-web-app -n "$TARGET_ENV" --timeout=180s
          kubectl annotate deployment zera-web-app -n "$TARGET_ENV" kubernetes.io/change-cause="Web $GITHUB_SHA ($DIGEST)" --overwrite
